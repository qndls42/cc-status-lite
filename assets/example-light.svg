<svg xmlns="http://www.w3.org/2000/svg" width="900" height="206" viewBox="0 0 900 206" role="img"
     aria-label="A terminal running Claude Code with cc-status-lite: the first line shows the model and the working directory with its git branch, the second shows context usage at 32 percent, the 5-hour limit at 21 percent resetting at 14:49, and the weekly limit at 46 percent resetting on September 3.">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .fg   { fill: #1f2328; }
    .dim  { fill: #59636e; }
    .grn  { fill: #1a7f37; }
    .acc  { fill: #0969da; }
    .cap  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #59636e; }
  </style>

  <rect x="0.5" y="0.5" width="899" height="205" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
  <circle cx="24" cy="22" r="5.5" fill="#ff5f57"/>
  <circle cx="43" cy="22" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="22" r="5.5" fill="#28c840"/>
  <line x1="0" y1="44" x2="900" y2="44" stroke="#d1d9e0"/>

  <text class="mono acc" x="24" y="78">&#x276F;</text>
  <rect x="42" y="66" width="9" height="16" fill="#0969da"/>

  <line x1="24" y1="100" x2="876" y2="100" stroke="#0969da" stroke-width="1.5"/>

  <text class="mono" x="24" y="128">
    <tspan class="fg">[Opus 5] </tspan><tspan class="dim">~/my-project (main)</tspan>
  </text>

  <text class="mono" x="24" y="154">
    <tspan>&#x1F9E0;</tspan><tspan class="fg"> </tspan><tspan class="grn">32%</tspan><tspan class="dim"> (64k/200k)</tspan><tspan class="fg">  </tspan><tspan>&#x1F550;</tspan><tspan class="fg"> 5h </tspan><tspan class="grn">21%</tspan><tspan class="dim"> (08/31 14:49)</tspan><tspan class="fg">  </tspan><tspan>&#x1F4C5;</tspan><tspan class="fg"> 7d </tspan><tspan class="grn">46%</tspan><tspan class="dim"> (09/03 17:59)</tspan>
  </text>

  <path d="M28 162 v6 M208 162 v6 M433 162 v6" stroke="#59636e" stroke-width="1" opacity="0.55"/>
  <text class="cap" x="24"  y="182">context window</text>
  <text class="cap" x="204" y="182">5-hour limit, resets 14:49</text>
